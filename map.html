  .leaflet-tile-pane { filter: var(--tile-filter); }   /* OSM colours -> warm greys */

  .journey-line { stroke: var(--ac-accent); }

  .stop-icon { background: none; border: 0; }
  .stop-marker {
    box-sizing: border-box; width: 24px; height: 24px;
    display: grid; place-items: center;
    font-family: var(--ac-font-mono); font-size: 11px; font-weight: 500; line-height: 1;

    border: 1px solid var(--ac-accent); border-radius: 2px;
  }
  .stop-marker.is-now { background: var(--ac-accent); color: var(--ac-on-accent); }

  .leaflet-popup-content-wrapper {
    background: var(--ac-paper-0); color: var(--ac-ink-1);
    border: 1px solid var(--ac-line-strong); border-radius: 4px;
    box-shadow: var(--ac-shadow-popover);
  }
  .leaflet-popup-tip { background: var(--ac-paper-0); border: 1px solid var(--ac-line-strong); box-shadow: none; }
  .leaflet-popup-content { margin: 12px 16px; font-size: 13px; line-height: 1.5; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--ac-ink-3); }
  .leaflet-container a.leaflet-popup-close-button:hover { color: var(--ac-ink-0); }
  .pop-meta {
    font-family: var(--ac-font-mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ac-accent);
  }
  .pop-title { margin-top: 4px; font-size: 14px; font-weight: 500; color: var(--ac-ink-0); }
  .pop-text  { color: var(--ac-ink-2); }
  .pop-area  { margin-top: 4px; font-family: var(--ac-font-mono); font-size: 11px; color: var(--ac-ink-3); }

  .leaflet-tooltip {
    background: var(--ac-paper-0); color: var(--ac-ink-0);
    border: 1px solid var(--ac-line-strong); border-radius: 2px; box-shadow: none;
    font-family: var(--ac-font-sans); font-size: 12px; padding: 4px 8px;
  }
  .leaflet-tooltip-top::before    { border-top-color: var(--ac-line-strong); }
  .leaflet-tooltip-bottom::before { border-bottom-color: var(--ac-line-strong); }
  .leaflet-tooltip-left::before   { border-left-color: var(--ac-line-strong); }
  .leaflet-tooltip-right::before  { border-right-color: var(--ac-line-strong); }

  .leaflet-bar, .leaflet-touch .leaflet-bar {
    border: 1px solid var(--ac-line-strong); border-radius: 4px; box-shadow: none;
  }
  .leaflet-bar a, .leaflet-bar a:hover {
    background: var(--ac-paper-0); color: var(--ac-ink-1); border-bottom-color: var(--ac-line);
  }
  .leaflet-bar a:hover { background: var(--ac-paper-3); }
  .leaflet-bar a.leaflet-disabled { color: var(--ac-ink-3); background: var(--ac-paper-2); }
  .leaflet-container .leaflet-control-attribution {
    background: var(--ac-paper-0); color: var(--ac-ink-3); font-size: 11px;
  }
  :focus-visible { outline: 2px solid var(--ac-accent); outline-offset: 2px; }
